name = "chorus-api"
main = "src/worker.ts"
compatibility_date = "2024-12-01"

[vars]
GEMINI_MODEL_ID = "gemini-2.5-flash"

[[d1_databases]]
binding = "DB"
database_name = "chorus-db"
database_id = "b203c563-852b-43cd-af89-99b29af6cf32"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "chorus-images"

# GEMINI_API_KEY は wrangler secret put GEMINI_API_KEY で設定
# PUBLIC_IMAGE_URL は R2 のパブリックドメインまたはカスタムドメインを設定
# WORKER_URL は Workers のデプロイ URL を設定
