name = "splisona-api"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../frontend/dist"

[vars]
GEMINI_MODEL_ID = "gemini-2.5-flash"
WORKER_URL = "https://splisona-api.demo-user01.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "chorus-db"
database_id = "b203c563-852b-43cd-af89-99b29af6cf32"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "chorus-images"
